name: Build Fyne App

# Builds run only on demand: the release skill dispatches this workflow
# with the version to stamp into the binary, and pull requests build to
# stay validated. Pushes to main/develop do NOT build (a release is one
# dispatch run, not a branch run plus a tag run).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binary (X.Y.Z)"
        required: true
        type: string
  pull_request:
    branches: [ main, develop ]

env:
  UPLOAD_DIR: upload

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: faceit-tester-linux-amd64.zip
          - os: windows-latest
            artifact: faceit-tester-windows-amd64.exe.zip
          - os: macos-latest
            artifact: faceit-tester-macos.app.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version input must be X.Y.Z, got '${{ inputs.version }}'" >&2
            exit 1
          fi

      - name: Stamp version (release builds)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        # Overwrite the committed "dev" placeholder with the release version
        # so the binary knows its own version for the startup update check.
        run: printf 'package main\n\n// version is the release this binary was built from.\nvar version = "%s"\n' "${{ inputs.version }}" > version.go

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Vet and Test (All)
        shell: bash
        run: |
          go vet ./...
          go test -short ./...

      - name: Install Fyne CLI
        shell: bash
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # fyne package emits a tar.xz; re-pack as a plain zip so the
        # in-app updater only ever needs archive/zip (no xz dependency).
        # The tree layout (usr/local/bin, Makefile, .desktop) is unchanged
        # for manual installers.
        run: |
          fyne package -os linux -release
          mkdir -p unpack "${{ env.UPLOAD_DIR }}"
          tar -xJf faceit-tester*.tar.xz -C unpack
          (cd unpack && zip -r "../${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          fyne package -os windows -release
          mkdir -p "${{ env.UPLOAD_DIR }}"
          7z a -tzip "${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fyne package -os darwin -release
          mkdir -p "${{ env.UPLOAD_DIR }}"
          zip -ry "${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.UPLOAD_DIR }}
