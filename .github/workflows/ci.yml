name: Build Fyne App

on:
  push:
    branches: [ main, develop ]
    tags: [ '[0-9]*.[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ main, develop ]

env:
  UPLOAD_DIR: upload

jobs:
  # Skips the expensive matrix when the pushed commit is already tagged:
  # a release pushes main + tag together, the tag-triggered run owns that
  # SHA (it stamps version.go), and rebuilding it on the branch event is
  # pure waste. Unguarded paths (normal pushes, PRs) always build.
  guard:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check whether the tag build already covers this SHA
        id: check
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch/PR push: skip when this exact commit is already tagged.
          # On any ls-remote failure `tagged` stays empty and we fall
          # through to build=true so CI can never be silently skipped.
          tagged=$(git ls-remote --tags "https://github.com/${{ github.repository }}" 2>/dev/null | cut -f1) || true
          if printf '%s\n' "$tagged" | grep -qxF "${{ github.sha }}"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Commit is tagged; deferring to the tag-triggered run."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: faceit-tester-linux-amd64.zip
          - os: windows-latest
            artifact: faceit-tester-windows-amd64.exe.zip
          - os: macos-latest
            artifact: faceit-tester-macos.app.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stamp version (tag builds)
        if: github.ref_type == 'tag'
        shell: bash
        # Overwrite the committed "dev" placeholder with the release tag so
        # the binary knows its own version for the startup update check.
        run: printf 'package main\n\n// version is the release tag this binary was built from.\nvar version = "%s"\n' "${{ github.ref_name }}" > version.go

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Vet and Test (All)
        shell: bash
        run: |
          go vet ./...
          go test -short ./...

      - name: Install Fyne CLI
        shell: bash
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # fyne package emits a tar.xz; re-pack as a plain zip so the
        # in-app updater only ever needs archive/zip (no xz dependency).
        # The tree layout (usr/local/bin, Makefile, .desktop) is unchanged
        # for manual installers.
        run: |
          fyne package -os linux -release
          mkdir -p unpack "${{ env.UPLOAD_DIR }}"
          tar -xJf faceit-tester*.tar.xz -C unpack
          (cd unpack && zip -r "../${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          fyne package -os windows -release
          mkdir -p "${{ env.UPLOAD_DIR }}"
          7z a -tzip "${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fyne package -os darwin -release
          mkdir -p "${{ env.UPLOAD_DIR }}"
          zip -ry "${{ env.UPLOAD_DIR }}/${{ matrix.artifact }}" faceit-tester.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.UPLOAD_DIR }}
